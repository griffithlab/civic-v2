@let a = assertion();
@let vwr = viewer();
@if (a) {
  <cvc-section-navigation
    [displayName]="a.name"
    [relationsTpl]="assertionRelations">
  </cvc-section-navigation>
  <ng-template #assertionRelations>
    <nz-space nzDirection="horizontal">
      <!-- parent relations -->
      <span
        nz-typography
        class="label"
        *nzSpaceItem
        ><strong>{{ a.name }}</strong> Parents:</span
      >
      <span
        *nzSpaceItem
        class="tags">
        <cvc-molecular-profile-tag
          [molecularProfile]="a.molecularProfile"
          [enablePopover]="false"></cvc-molecular-profile-tag>
      </span>
    </nz-space>
  </ng-template>
  <nz-page-header class="site-page-header">
    <!-- title -->
    <nz-page-header-title cvcFlaggableOptions>
      Evaluate
      @if (a.assertionType == 'ONCOGENIC') {
        Oncogenicity
      } @else if (a.assertionType == 'PREDISPOSING') {
        Pathogenicity
      } @else {
        Clinical Significance
      }
      for
      <i
        nz-icon
        nzTheme="twotone"
        [nzTwotoneColor]="'Assertion' | entityColor"
        nzType="civic-assertion"></i>
      {{ a.name }}
    </nz-page-header-title>
    <nz-page-header-content>
      <div class="content">
        @if (vwr && vwr.signedIn) {
          <cvc-specification-submit-form
          [assertionId]="assertionId()"></cvc-specification-submit-form>
        } @else {
          <nz-row
            nzSpan="24"
            nzJustify="center">
            <div
              nz-col
              nzSpan="6">
              <cvc-login-prompt></cvc-login-prompt>
            </div>
          </nz-row>
        }
      </div>
    </nz-page-header-content>
  </nz-page-header>
}
