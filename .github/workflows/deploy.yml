name: Deploy CIViC

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      SSH_HOST:
        required: true
      SSH_KEY:
        required: true

jobs:
  deploy:
    name: Capistrano Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key to Server
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: github-actions
          known_hosts: 'random-placeholder-value-replaced-by-keyscan-below'
          if_key_exists: replace
          config: |
            host ${{ secrets.SSH_HOST }}
              IdentityFile ~/.ssh/github-actions
              IdentitiesOnly yes
              ForwardAgent yes
      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          working-directory: ./server
          ruby-version: '4.0'
          bundler-cache: true

      - name: Deploy to production
        working-directory: ./server
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/github-actions
          bundle exec cap ${{ inputs.environment }} deploy
