name: Tests
on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging]

jobs:
  scan_ruby:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '4.0.1'
          working-directory: ./server

      - name: Scan for security vulnerabilities
        working-directory: ./server
        run: bin/brakeman --no-pager
  lint:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          working-directory: ./server
          bundler-cache: true

      - name: Lint code
        working-directory: ./server
        run: bin/rubocop -f github

  backend_tests:
    name: Backend Tests
    runs-on: 'ubuntu-latest'
    services:
        postgres:
          image: pgvector/pgvector:pg18
          env:
            POSTGRES_USER: postgres
            POSTGRES_DB: civic_test
            POSTGRES_PASSWORD: 'ci'
          ports:
            - 5432:5432

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup elasticsearch'
        uses: ankane/setup-elasticsearch@v1

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '4.0.1'
          working-directory: ./server

      - name: Setup DB
        env:
          CI_BUILD: true
          RAILS_ENV: test
        run: bundle exec rails db:create db:schema:load
        working-directory: ./server

      - name: Run Tests
        env:
          CI_BUILD: true
          RAILS_ENV: test
          CIVIC_API_HMAC_KEY: fakeKeyForTests
        run: bundle exec rails test
        working-directory: ./server

  frontend_tests:
    name: Frontend Tests
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
        working-directory: ./client

      - run: yarn install --immutable
        working-directory: ./client

      - run: yarn test
        working-directory: ./client

      - run: yarn build
        working-directory: ./client

  # ESLint errors are a hard gate; warnings are ratcheted. The tree carries ~1036
  # warnings (mostly prefer-standalone / prefer-inject from the Angular 22
  # migration), so failing on any warning would fail on day one and teach people
  # to ignore the job. --max-warnings pins the current count instead: new
  # warnings fail, and the number only ever goes down. Lower it when you fix
  # some — same ratchet as ALLOWED_CYCLES in check-import-cycles.mjs.
  frontend_lint:
    name: Frontend Lint
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
        working-directory: ./client

      - run: yarn install --immutable
        working-directory: ./client

      - run: yarn ng lint --max-warnings=1036
        working-directory: ./client

  # Playwright specs tagged @offline, which are the ones that hold with nothing
  # behind /api — see the comment in client/playwright.config.ts. The rest of the
  # suite (the entity-manager goldens, the select typeaheads) asserts against
  # real API data and would need Rails, Postgres and Elasticsearch stood up the
  # way backend_tests does; that is worth doing, but it is its own change.
  e2e:
    name: E2E (offline)
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
        working-directory: ./client

      - run: yarn install --immutable
        working-directory: ./client

      - name: Install Playwright browsers
        working-directory: ./client
        run: yarn playwright install --with-deps chromium

      # webServer in playwright.config.ts starts the dev server itself and waits
      # for baseURL, so there is no separate serve step here.
      - run: yarn e2e:offline
        working-directory: ./client

      - name: Upload traces for failed specs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/test-results/
          retention-days: 7

  # Circular imports between first-party modules can never be tree-shaken apart,
  # so importing any module in a cycle drags in all of them. This runs as its own
  # job rather than inside frontend_tests because it needs a --stats-json build,
  # and that writes stats.json into the output path — which for `yarn build` is
  # server/public, whose contents get committed by the deploy workflow.
  import_cycles:
    name: Circular Imports
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
        working-directory: ./client

      - run: yarn install --immutable
        working-directory: ./client

      - name: Build with metafile
        working-directory: ./client
        run: yarn ng build --configuration production --stats-json --output-path dist/stats-build

      - run: yarn check:cycles
        working-directory: ./client

  # Committed generated GraphQL code must match what codegen produces from
  # the committed schema + .gql documents. (The schema SDL itself is kept in
  # sync with the Ruby schema by server/test/graphql/updated_idl_test.rb in
  # backend_tests.)
  codegen_drift:
    name: GraphQL Codegen Drift
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
        working-directory: ./client

      - run: yarn install --immutable
        working-directory: ./client

      - run: yarn generate-apollo
        working-directory: ./client

      - name: Fail on stale generated artifacts
        working-directory: ./client
        run: |
          git add -A src
          git diff --cached --exit-code --stat -- src
