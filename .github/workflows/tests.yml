name: Tests
on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging]

jobs:
  scan_ruby:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          bundler-cache: true
          ruby-version: '4.0'
          working-directory: ./server

      - name: Scan for security vulnerabilities
        working-directory: ./server
        run: bin/brakeman --no-pager
  lint:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '4.0'
          working-directory: ./server
          bundler-cache: true

      - name: Lint code
        working-directory: ./server
        run: bin/rubocop -f github

  backend_tests:
    name: Backend Tests
    runs-on: 'ubuntu-latest'
    services:
        postgres:
          image: pgvector/pgvector:pg18
          env:
            POSTGRES_USER: postgres
            POSTGRES_DB: civic_test
            POSTGRES_PASSWORD: 'ci'
          ports:
            - 5432:5432

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Setup elasticsearch'
        uses: ankane/setup-elasticsearch@31ef32c3c8f64eb06167398f88ca6582fd2aad6d # v1

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          bundler-cache: true
          ruby-version: '4.0'
          working-directory: ./server

      - name: Setup DB
        env:
          CI_BUILD: true
          RAILS_ENV: test
        run: bundle exec rails db:create db:schema:load
        working-directory: ./server

      - name: Run Tests
        env:
          CI_BUILD: true
          RAILS_ENV: test
          CIVIC_API_HMAC_KEY: fakeKeyForTests
        run: bundle exec rails test
        working-directory: ./server

  frontend_tests:
    name: Frontend Tests
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install -g yarn
        working-directory: ./client

      - run: yarn install
        working-directory: ./client

      - run: yarn build
        working-directory: ./client
