name: Tests
on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging]

jobs:
  scan_ruby:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '4.0.1'
          working-directory: ./server

      - name: Scan for security vulnerabilities
        working-directory: ./server
        run: bin/brakeman --no-pager
  lint:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          working-directory: ./server
          bundler-cache: true

      - name: Lint code
        working-directory: ./server
        run: bin/rubocop -f github

  backend_tests:
    name: Backend Tests
    runs-on: 'ubuntu-latest'
    services:
        postgres:
          image: pgvector/pgvector:pg18
          env:
            POSTGRES_USER: postgres
            POSTGRES_DB: civic_test
            POSTGRES_PASSWORD: 'ci'
          ports:
            - 5432:5432

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup elasticsearch'
        uses: ankane/setup-elasticsearch@v1

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '4.0.1'
          working-directory: ./server

      - name: Setup DB
        env:
          CI_BUILD: true
          RAILS_ENV: test
        run: bundle exec rails db:create db:schema:load
        working-directory: ./server

      - name: Run Tests
        env:
          CI_BUILD: true
          RAILS_ENV: test
          CIVIC_API_HMAC_KEY: fakeKeyForTests
        run: bundle exec rails test
        working-directory: ./server

  frontend_tests:
    name: Frontend Tests
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
        working-directory: ./client

      - run: yarn install --immutable
        working-directory: ./client

      - run: yarn test
        working-directory: ./client

      - run: yarn build
        working-directory: ./client

  # Committed generated GraphQL code must match what codegen produces from
  # the committed schema + .gql documents. (The schema SDL itself is kept in
  # sync with the Ruby schema by server/test/graphql/updated_idl_test.rb in
  # backend_tests.)
  codegen_drift:
    name: GraphQL Codegen Drift
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
        working-directory: ./client

      - run: yarn install --immutable
        working-directory: ./client

      - run: yarn generate-apollo
        working-directory: ./client

      - name: Fail on stale generated artifacts
        working-directory: ./client
        run: |
          git add -A src
          git diff --cached --exit-code --stat -- src
