name: Build CIViC Frontend

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          working-directory: ./server
          bundler-cache: true
          ruby-version: '4.0'

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm install -g yarn
        working-directory: ./client

      - run: yarn install --frozen-lockfile
        working-directory: ./client

      - run: rm -f public/*.js
        working-directory: ./server

      - run: yarn build
        working-directory: ./client

      - run: bundle exec rails assets:precompile
        working-directory: ./server
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: 1

      - run: bundle exec rake rails_schema:generate
        working-directory: ./server
        env:
          SECRET_KEY_BASE_DUMMY: 1

      - if: ${{ inputs.branch == 'staging' }}
        run: mv -f lib/assets/favicon.staging.ico public/favicon.ico
        working-directory: ./server

      - name: Commit and push build
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: server/public/*
          push: origin ${{ inputs.branch }}
          message: Automated frontend build
