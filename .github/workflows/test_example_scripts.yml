name: Test Example Scripts

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging]

jobs:
  run-scripts:
    runs-on: 'ubuntu-latest'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
      with:
        ruby-version: '4.0'

    - name: Install Ruby dependencies
      run: gem install httparty

    - name: Run Ruby script
      run: ruby examples/fetch_variant_links.rb

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install Python dependencies
      run: pip install requests

    - name: Run Python script
      run: python examples/fetch_all_variants.py

    - name: Set up R
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        r-version: '4.4'

    - name: Install system dependencies for R packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

    - name: Run R script
      run: Rscript examples/fetch_acmg_code.R
