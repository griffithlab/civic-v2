@if (therapy$ | ngrxPush; as therapy) {
  <cvc-section-navigation [displayName]="therapy.name">
  </cvc-section-navigation>
  <nz-page-header class="site-page-header">
    <nz-page-header-title>
      <i
        nz-icon
        nzTheme="twotone"
        [nzTwotoneColor]="'Therapy' | entityColor"
        nzType="civic-therapy"></i>
      {{ therapy.name }}
    </nz-page-header-title>
    @if (therapy.ncitId) {
      <nz-page-header-extra>
        @if (therapy.therapyUrl) {
          <cvc-link-tag
            [href]="therapy.therapyUrl"
            tooltip="View in the NCIthesaurus">
            {{ therapy.ncitId }}
          </cvc-link-tag>
        }
      </nz-page-header-extra>
    }
    <nz-page-header-content>
      @if (therapy.deprecated) {
        <nz-alert
          nzBanner
          nzMessage="This Therapy has been deprecated."
          nzType="error"></nz-alert>
      }
      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </nz-page-header-content>
  </nz-page-header>
}
