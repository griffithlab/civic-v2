query FeatureDetail($featureId: Int!) {
  feature(id: $featureId) {
    ...FeatureDetailFields
  }
}

fragment FeatureDetailFields on Feature {
  id
  name
  fullName
  deprecated
  deprecationReason
  deprecationActivity {
    parsedNote {
      ...parsedCommentFragment
    }
  }
  featureInstance {
    ...FeatureInstanceRef
  }
  flags(state: OPEN) {
    totalCount
  }
   revisions(status: NEW) {
     totalCount
   }
   comments {
     totalCount
   }
}
