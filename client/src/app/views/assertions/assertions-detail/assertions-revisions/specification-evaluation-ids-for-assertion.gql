query SpecificationEvaluationIdsForAssertion($assertionId: Int!) {
  assertion(id: $assertionId) {
    ...AssertionSpecificationEvaluationIds
  }
}

fragment AssertionSpecificationEvaluationIds on Assertion {
  __typename
  openRevisionCount
  specificationEvaluations {
    openRevisionCount
    id
    specificationCriterium {
      criterium
    }
  }
  specificationsWithEvaluations {
    specification {
      name
      version
    }
    evaluations {
      openRevisionCount
      id
      specificationCriterium {
        criterium
      }
    }
  }
}
