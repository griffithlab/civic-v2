query AssertionDetail($assertionId: Int!) {
  assertion(id: $assertionId) {
    ...AssertionDetailFields
  }
}

fragment AssertionDetailFields on Assertion {
  id
  name
  assertionType
  status
  submissionEvent {
    originatingUser {
      id
    }
  }
  molecularProfile {
    id
    name
    link
    deprecated
    flagged
  }
  flags(state: OPEN) {
    totalCount
  }
  openRevisionCount
  comments {
    totalCount
  }
  approvals {
    totalCount
    nodes {
      ...approvalListNode
    }
  }
  ...assertionSubmissionActivity
  specificationsWithEvaluations {
    specification {
      ...SpecificationFields
    }
    evaluations {
      ...SpecificationEvaluationFields
    }
  }
}

fragment assertionSubmissionActivity on Assertion {
  submissionActivity {
    createdAt
    parsedNote {
      ...parsedCommentFragment
    }
    user {
      ...commenterFields
    }
  }
}
