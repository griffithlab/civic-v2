@if (evidence$ | async; as evidence) {
  <cvc-section-navigation
    [displayName]="evidence.name"
    [relationsTpl]="evidenceRelations">
  </cvc-section-navigation>
  <ng-template #evidenceRelations>
    <nz-space nzDirection="horizontal">
      <!-- parent relations -->
      <span
        nz-typography
        class="label"
        *nzSpaceItem
        ><strong>{{ evidence.name }}</strong> Parents:</span
      >
      <span
        *nzSpaceItem
        class="tags">
        <cvc-molecular-profile-tag
          [molecularProfile]="evidence.molecularProfile"
          [enablePopover]="false"></cvc-molecular-profile-tag>
      </span>
    </nz-space>
  </ng-template>
  <nz-page-header class="site-page-header">
    <!-- title -->
    <nz-page-header-title cvcFlaggableOptions>
      REVISE
      <i
        nz-icon
        nzTheme="twotone"
        [nzTwotoneColor]="'EvidenceItem' | entityColor"
        nzType="civic-evidence"></i>
      {{ evidence.name }}
    </nz-page-header-title>
    <nz-page-header-content>
      <div class="content">
        @if (isSignedIn$ | ngrxPush; as isSignedIn) {
          <div>
            <router-outlet></router-outlet>
          </div>
        } @else {
          <nz-row
            nzSpan="24"
            nzJustify="center">
            <div
              nz-col
              nzSpan="6">
              <cvc-login-prompt></cvc-login-prompt>
            </div>
          </nz-row>
        }
      </div>
    </nz-page-header-content>
  </nz-page-header>
}
