<nz-select
  [formControl]="formControl"
  [formlyAttributes]="field"
  [class.ng-dirty]="showError"
  [nzMode]="props.isMultiSelect ? 'multiple' : 'default'"
  [nzPlaceHolder]="props.placeholder || 'Select Reference Build'"
  [nzDisabled]="!!props.disabled"
  [nzCustomTemplate]="selectedTpl">
  @for (build of optionValues(); track build) {
    <nz-option
      nzCustomContent
      [nzValue]="build"
      [nzLabel]="build">
      <nz-tag>
        <strong>{{ build }}</strong>
      </nz-tag>
    </nz-option>
  }
</nz-select>

<ng-template
  #selectedTpl
  let-selected>
  <div class="ant-select-selection-item-content">
    @if (props.isMultiSelect) {
      {{ selected.nzValue }}
    } @else {
      <nz-tag
        nzMode="closeable"
        (nzOnClose)="onTagClose()">
        <strong>{{ selected.nzValue }}</strong>
      </nz-tag>
    }
  </div>
</ng-template>
