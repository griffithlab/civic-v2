<div nz-row>
  <div
    nz-col
    nzSpan="4">
    <nz-steps
      nzProgressDot
      nzDirection="vertical"
      [nzCurrent]="currentStep()">
      @for (step of field.fieldGroup; track step.key) {
        <nz-step [nzTitle]="step.props?.stepLabel"> </nz-step>
      }
    </nz-steps>
  </div>
  <div
    nz-col
    nzSpan="20">
    @let stepField =
      field.fieldGroup ? field.fieldGroup[currentStep()] : undefined;
    @if (stepField) {
      <formly-field [field]="stepField"></formly-field>
    }
    @if (currentStep() > 0) {
      <button
        nz-button
        nzType="default"
        (click)="previousStep()">
        <span>Previous</span>
      </button>
    }
    @if (currentStep() < field.fieldGroup!.length - 1) {
      <button
        nz-button
        nzType="default"
        (click)="nextStep()">
        <span>Next</span>
      </button>
    }
  </div>
</div>
