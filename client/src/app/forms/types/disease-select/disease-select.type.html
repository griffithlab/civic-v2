<nz-select
  cvcEntitySelect
  [formControl]="formControl"
  [formlyAttributes]="field"
  [class.ng-dirty]="showError"
  [nzMode]="props.isMultiSelect ? 'multiple' : 'default'"
  [nzPlaceHolder]="props.placeholder || 'Search ' + props.entityName.plural"
  [nzDisabled]="!!props.disabled"
  [nzLoading]="isLoading()"
  [nzOpen]="open()!"
  [nzCustomTemplate]="selectedTpl"
  [nzNotFoundContent]="notFoundTpl"
  [nzDropdownRender]="dropdownRender()"
  (nzOnSearch)="search.set($event)"
  (nzOpenChange)="onOpenChange($event)">
  @for (result of results(); track result.id) {
    <nz-option
      nzCustomContent
      [nzValue]="result.id"
      [nzLabel]="result.name">
      <cvc-tag
        [ref]="refFor(result)"
        [linked]="false"
        [emphasize]="searchTerm()" />
      <span
        nz-typography
        nzType="secondary">
        @if (result.doid) {
          <strong>DOID:</strong>
          <cvc-highlight
            [text]="result.doid"
            [emphasize]="searchTerm()" />
        }
        @if (result.diseaseAliases.length > 0) {
          &nbsp;
          <strong>Aliases:</strong>
          <em
            nz-tooltip
            [nzTooltipTitle]="result.diseaseAliases.join(', ')">
            <cvc-highlight
              [text]="result.diseaseAliases.join(', ')"
              [emphasize]="searchTerm()" />
          </em>
        }
      </span>
    </nz-option>
  }
</nz-select>

<!-- selected item(s): nz-select hands back only the bare id, the tag renders
     itself from the Apollo cache -->
<ng-template
  #selectedTpl
  let-selected>
  <div class="ant-select-selection-item-content">
    @if (refForId(selected.nzValue); as ref) {
      <cvc-tag
        [ref]="ref"
        [context]="props.isMultiSelect ? 'multi-select-item' : 'select-item'"
        (closed)="onTagClose()" />
    }
  </div>
</ng-template>

<ng-template #notFoundTpl>
  <cvc-select-messages [display]="notFound()" />
</ng-template>

<ng-template #addForm>
  <cvc-select-add-form>
    <cvc-disease-quick-add-form
      [cvcSearchString]="notFound().searchStr"
      (cvcOnCreate)="onEntityCreated($event)" />
  </cvc-select-add-form>
</ng-template>
