query DiseaseSelectTypeahead($name: String!) {
  diseaseTypeahead(queryTerm: $name) {
    ...DiseaseSelectTypeaheadFields
  }
}

query DiseaseSelectTag($id: Int!) {
  disease(id: $id) {
    ...DiseaseSelectTypeaheadFields
  }
}

# Spreads LinkableDisease so every Disease this field writes to the cache
# satisfies cvc-tag's watchFragment read without a second round-trip
# (see src/app/tags/linkable.fragments.gql).
fragment DiseaseSelectTypeaheadFields on Disease {
  ...LinkableDisease
  doid
  diseaseAliases
}
