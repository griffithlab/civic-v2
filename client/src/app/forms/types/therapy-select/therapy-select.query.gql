query TherapySelectTypeahead($name: String!) {
  therapyTypeahead(queryTerm: $name) {
    ...TherapySelectTypeaheadFields
  }
}

query TherapySelectTag($id: Int!) {
  therapy(id: $id) {
    ...TherapySelectTypeaheadFields
  }
}

# Spreads LinkableTherapy so every Therapy this field writes to the cache
# satisfies cvc-tag's watchFragment read without a second round-trip
# (see src/app/tags/linkable.fragments.gql).
fragment TherapySelectTypeaheadFields on Therapy {
  ...LinkableTherapy
  ncitId
  therapyAliases
}
