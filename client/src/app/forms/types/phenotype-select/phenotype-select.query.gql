query PhenotypeSelectTypeahead($name: String!) {
  phenotypeTypeahead(queryTerm: $name) {
    ...PhenotypeSelectTypeaheadFields
  }
}

query PhenotypeSelectTag($id: Int!) {
  phenotype(id: $id) {
    ...PhenotypeSelectTypeaheadFields
  }
}

# Spreads LinkablePhenotype so every Phenotype this field writes to the cache
# satisfies cvc-tag's watchFragment read without a second round-trip
# (see src/app/tags/linkable.fragments.gql).
fragment PhenotypeSelectTypeaheadFields on Phenotype {
  ...LinkablePhenotype
  hpoId
}
