query AcmgCodeSelectTypeahead($code: String!) {
  acmgCodesTypeahead(queryTerm: $code) {
    ...AcmgCodeSelectTypeaheadFields
  }
}

query AcmgCodeSelectTag($id: Int!) {
  acmgCode(id: $id) {
    ...AcmgCodeSelectTypeaheadFields
  }
}

# Spreads LinkableAcmgCode so every AcmgCode this field writes to the cache
# satisfies cvc-tag's watchFragment read without a second round-trip (see
# src/app/tags/linkable.fragments.gql). AcmgCode has no link; cvc-tag renders
# its tooltip field, which is why the fragment carries it.
fragment AcmgCodeSelectTypeaheadFields on AcmgCode {
  ...LinkableAcmgCode
  code
  description
}
