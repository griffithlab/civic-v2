query VariantSelectTypeahead($name: String!, $featureId: Int) {
  variantsTypeahead(queryTerm: $name, featureId: $featureId) {
    ...VariantSelectTypeaheadFields
  }
}

# One spread on the interface covers every concrete Variant type. This used to
# repeat the same spread inside five inline fragments (Variant, GeneVariant,
# FactorVariant, FusionVariant, RegionVariant), which selected exactly the
# same fields.
query VariantSelectTag($variantId: Int!) {
  variant(id: $variantId) {
    ...VariantSelectTypeaheadFields
  }
}

# Spreads LinkableVariant so a selected Variant lands in the cache in exactly
# the shape cvc-tag's watchFragment reads, whatever its concrete typename.
fragment VariantSelectTypeaheadFields on VariantInterface {
  ...LinkableVariant
  variantAliases
  singleVariantMolecularProfileId
  singleVariantMolecularProfile {
    id
    name
    link
    molecularProfileAliases
  }
}
