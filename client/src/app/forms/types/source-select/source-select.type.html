<nz-row
  class="select-layout"
  [nzGutter]="[6, 6]">
  @if (showTypeSelect()) {
    <nz-col nzFlex="80px">
      <!-- ngModelOptions standalone: this picker is local UI state, not part of
           the formly form's control group -->
      <nz-select
        nzSize="default"
        nzBlock
        [nzOptionHeightPx]="28"
        [ngModel]="param()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="setSourceType($event)">
        <nz-option
          nzValue="PUBMED"
          nzLabel="PubMed" />
        <nz-option
          nzValue="ASCO"
          nzLabel="ASCO" />
        <nz-option
          nzValue="ASH"
          nzLabel="ASH" />
      </nz-select>
    </nz-col>
    <nz-col
      class="prefix"
      nzFlex="60px">
      @switch (param()) {
        @case ('PUBMED') {
          <div>PMID:</div>
        }
        @case ('ASCO') {
          <div>ID:</div>
        }
        @case ('ASH') {
          <div>doi.org/</div>
        }
      }
    </nz-col>
  }
  <nz-col nzFlex="auto">
    <nz-select
      cvcEntitySelect
      [formControl]="formControl"
      [formlyAttributes]="field"
      [class.ng-dirty]="showError"
      [nzMode]="props.isMultiSelect ? 'multiple' : 'default'"
      [nzPlaceHolder]="placeholder()"
      [nzDisabled]="!!props.disabled"
      [nzLoading]="isLoading()"
      [nzOpen]="open()!"
      [nzCustomTemplate]="selectedTpl"
      [nzNotFoundContent]="notFoundTpl"
      [nzDropdownRender]="dropdownRender()"
      (nzOnSearch)="search.set($event)"
      (nzOpenChange)="onOpenChange($event)">
      @for (result of results(); track result.id) {
        <nz-option
          nzCustomContent
          [nzValue]="result.id"
          [nzLabel]="result.name">
          <cvc-tag
            [ref]="refFor(result)"
            [linked]="false"
            [emphasize]="searchTerm()" />
          <span
            nz-typography
            nzType="secondary">
            <strong>ID:</strong>
            <cvc-highlight
              [text]="result.citationId"
              [emphasize]="searchTerm()" />
          </span>
        </nz-option>
      }
    </nz-select>
  </nz-col>
</nz-row>

<!-- selected item(s): nz-select hands back only the bare id, the tag renders
     itself from the Apollo cache -->
<ng-template
  #selectedTpl
  let-selected>
  <div class="ant-select-selection-item-content">
    @if (refForId(selected.nzValue); as ref) {
      <cvc-tag
        [ref]="ref"
        [context]="props.isMultiSelect ? 'multi-select-item' : 'select-item'"
        (closed)="onTagClose()" />
    }
  </div>
</ng-template>

<ng-template #notFoundTpl>
  <cvc-select-messages [display]="notFound()" />
</ng-template>

<ng-template #addForm>
  <cvc-select-add-form>
    <cvc-source-quick-add-form
      [cvcCitationId]="notFound().searchStr"
      [cvcSourceType]="param()!"
      (cvcOnCreate)="onEntityCreated($event)" />
  </cvc-select-add-form>
</ng-template>
