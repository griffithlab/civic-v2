query SourceSelectTypeahead(
  $partialCitationId: String!
  $sourceType: SourceSource!
) {
  sourceTypeahead(citationId: $partialCitationId, sourceType: $sourceType) {
    ...SourceSelectTypeaheadFields
  }
}

query SourceSelectTag($id: Int!) {
  source(id: $id) {
    ...SourceSelectTypeaheadFields
  }
}

# Spreads LinkableSource so every Source this field can select lands in the
# cache in exactly the shape cvc-tag's watchFragment reads. citationId is the
# one extra field, shown as the dropdown option's metadata.
fragment SourceSelectTypeaheadFields on Source {
  ...LinkableSource
  citationId
}
