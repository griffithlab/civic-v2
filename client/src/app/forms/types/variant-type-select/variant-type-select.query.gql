query VariantTypeSelectTypeahead($name: String!) {
  variantTypeTypeahead(queryTerm: $name) {
    ...VariantTypeSelectTypeaheadFields
  }
}

query VariantTypeSelectTag($id: Int!) {
  variantType(id: $id) {
    ...VariantTypeSelectTypeaheadFields
  }
}

# Spreads LinkableVariantType so every VariantType this field writes to the
# cache satisfies cvc-tag's watchFragment read without a second round-trip
# (see src/app/tags/linkable.fragments.gql).
fragment VariantTypeSelectTypeaheadFields on VariantType {
  ...LinkableVariantType
  soid
}
