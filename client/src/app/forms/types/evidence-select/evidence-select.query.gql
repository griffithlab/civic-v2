query EvidenceSelectTypeahead($eid: Int!) {
  evidenceItems(id: $eid) {
    nodes {
      ...EvidenceSelectTypeaheadFields
    }
  }
}

query EvidenceSelectTag($eid: Int!) {
  evidenceItem(id: $eid) {
    ...EvidenceSelectTypeaheadFields
  }
}

# Spreads LinkableEvidenceItem so a selected item lands in the cache in
# exactly the shape cvc-tag's watchFragment reads; the rest is the metadata
# the dropdown option shows.
fragment EvidenceSelectTypeaheadFields on EvidenceItem {
  ...LinkableEvidenceItem
  evidenceType
  evidenceDirection
  evidenceLevel
  evidenceRating
  significance
  variantOrigin
  status
}
