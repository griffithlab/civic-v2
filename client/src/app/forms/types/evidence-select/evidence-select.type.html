<nz-row [nzGutter]="[6, 6]">
  <nz-col nzFlex="auto">
    <nz-select
      cvcEntitySelect
      [formControl]="formControl"
      [formlyAttributes]="field"
      [class.ng-dirty]="showError"
      [nzMode]="props.isMultiSelect ? 'multiple' : 'default'"
      [nzPlaceHolder]="props.placeholder || 'Select ' + props.entityName.plural"
      [nzDisabled]="!!props.disabled"
      [nzLoading]="isLoading()"
      [nzOpen]="open()!"
      [nzCustomTemplate]="selectedTpl"
      [nzNotFoundContent]="notFoundTpl"
      (nzOnSearch)="search.set($event)"
      (nzOpenChange)="onOpenChange($event)">
      @for (result of results(); track result.id) {
        <nz-option
          nzCustomContent
          [nzValue]="result.id"
          [nzLabel]="'EID' + result.id">
          <cvc-tag
            [ref]="refFor(result)"
            [linked]="false"
            [emphasize]="searchTerm()" />
        </nz-option>
      }
    </nz-select>
  </nz-col>

  @if (props.showManager) {
    <nz-col nzFlex="50px">
      <button
        type="button"
        nz-button
        nzBlock
        class="manager-button"
        (click)="toggleManager()">
        <span
          nz-icon
          nzType="caret-right"
          [class.show]="showManager()"
          [class.hide]="!showManager()"></span>
        Manager
      </button>
    </nz-col>

    @if (showManager()) {
      <nz-col
        class="manager-drawer"
        nzSpan="24">
        <cvc-evidence-manager
          [cvcSelectedIds]="selected()"
          [cvcTableSettings]="tableSettings()"
          (cvcSelectedIdsChange)="onManagerSelection($event)" />
      </nz-col>
    }
  }
</nz-row>

<!-- selected item(s): nz-select hands back only the bare id, the tag renders
     itself from the Apollo cache -->
<ng-template
  #selectedTpl
  let-selected>
  <div class="ant-select-selection-item-content">
    @if (refForId(selected.nzValue); as ref) {
      <cvc-tag
        [ref]="ref"
        [context]="props.isMultiSelect ? 'multi-select-item' : 'select-item'"
        (closed)="onTagClose()" />
    }
  </div>
</ng-template>

<ng-template #notFoundTpl>
  <cvc-select-messages [display]="notFound()" />
</ng-template>
