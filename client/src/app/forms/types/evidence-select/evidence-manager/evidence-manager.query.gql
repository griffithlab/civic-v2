query EvidenceManager(
  $first: Int
  $last: Int
  $before: String
  $after: String
  $diseaseName: String
  $therapyName: String
  $id: Int
  $description: String
  $evidenceLevel: EvidenceLevel
  $evidenceDirection: EvidenceDirection
  $significance: EvidenceSignificance
  $evidenceType: EvidenceType
  $rating: Int
  $variantOrigin: VariantOrigin
  $variantId: Int
  $molecularProfileId: Int
  $assertionId: Int
  $organizationId: [Int!]
  $userId: Int
  $sortBy: EvidenceSort
  $phenotypeId: Int
  $diseaseId: Int
  $therapyId: Int
  $therapyInteractionType: TherapyInteraction
  $sourceId: Int
  $clinicalTrialId: Int
  $molecularProfileName: String
  $status: EvidenceStatusFilter
) {
  evidenceItems(
    first: $first
    last: $last
    before: $before
    after: $after
    diseaseName: $diseaseName
    therapyName: $therapyName
    id: $id
    description: $description
    evidenceLevel: $evidenceLevel
    evidenceDirection: $evidenceDirection
    significance: $significance
    evidenceType: $evidenceType
    evidenceRating: $rating
    variantOrigin: $variantOrigin
    variantId: $variantId
    molecularProfileId: $molecularProfileId
    assertionId: $assertionId
    organization: {ids: $organizationId}
    userId: $userId
    phenotypeId: $phenotypeId
    diseaseId: $diseaseId
    therapyId: $therapyId
    therapyInteractionType: $therapyInteractionType
    sourceId: $sourceId
    clinicalTrialId: $clinicalTrialId
    molecularProfileName: $molecularProfileName
    status: $status
    sortBy: $sortBy
  ) {
    totalCount
    pageCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    # edges only, never `nodes`. Both expose the same rows, so selecting both
    # spreads this fragment twice and transfers every row twice — measured at
    # 82.8 kB against 42.0 kB for 50 rows. The cursor is what pagination needs.
    edges {
      cursor
      node {
        ...EvidenceManagerFields
      }
    }
  }
}

fragment EvidenceManagerFields on EvidenceItem {
  id
  name
  link
  # Spread the Linkable* fragments rather than restating their fields. cvc-tag
  # reads these entities straight out of the cache via watchFragment, so a
  # selection that misses even one field renders a degraded tag and logs
  # "incomplete cache data". That is what had happened to molecularProfile,
  # which was missing `flagged`.
  disease {
    ...LinkableDisease
  }
  therapies {
    ...LinkableTherapy
  }
  molecularProfile {
    ...LinkableMolecularProfile
    parsedName {
      ...MolecularProfileParsedName
    }
  }
  status
  flagged
  therapyInteractionType
  description
  evidenceType
  evidenceDirection
  evidenceLevel
  evidenceRating
  significance
  variantOrigin
}
