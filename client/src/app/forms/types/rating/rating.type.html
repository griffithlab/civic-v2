<input
  type="hidden"
  [formControl]="formControl"
  [formlyAttributes]="field" />

<div class="rate-block">
  <nz-rate
    [ngModel]="formControl.value"
    [ngModelOptions]="{ standalone: true }"
    [nzCount]="props.count"
    [nzTooltips]="props.hoverText"
    (ngModelChange)="onRatingChange($event)"></nz-rate>
</div>
