query NccnGuidelineSelectTypeahead($name: String!) {
  nccnGuidelinesTypeahead(queryTerm: $name) {
    ...NccnGuidelineSelectTypeaheadFields
  }
}

query NccnGuidelineSelectTag($id: Int!) {
  nccnGuideline(id: $id) {
    ...NccnGuidelineSelectTypeaheadFields
  }
}

# Spreads LinkableNccnGuideline so every NccnGuideline this field writes to
# the cache satisfies cvc-tag's watchFragment read without a second
# round-trip (see src/app/tags/linkable.fragments.gql). NccnGuideline has no
# link field, so the fragment is the whole shape.
fragment NccnGuidelineSelectTypeaheadFields on NccnGuideline {
  ...LinkableNccnGuideline
}
