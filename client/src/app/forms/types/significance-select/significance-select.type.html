<nz-select
  [formControl]="formControl"
  [formlyAttributes]="field"
  [class.ng-dirty]="showError"
  [nzMode]="props.isMultiSelect ? 'multiple' : 'default'"
  [nzPlaceHolder]="placeholder()"
  [nzDisabled]="!!props.disabled"
  [nzCustomTemplate]="selectedTpl">
  @for (significance of optionValues(); track significance) {
    <nz-option
      nzCustomContent
      [nzValue]="significance"
      [nzLabel]="significance">
      <cvc-attribute-tag [cvcAttrValue]="significance" />
    </nz-option>
  }
</nz-select>

<ng-template
  #selectedTpl
  let-selected>
  <div class="ant-select-selection-item-content">
    <cvc-attribute-tag
      [cvcAttrValue]="selected.nzValue"
      [cvcContext]="props.isMultiSelect ? 'multi-select-item' : 'select-item'"
      [cvcMode]="props.isMultiSelect ? 'default' : 'closeable'"
      (cvcOnClose)="onTagClose()" />
  </div>
</ng-template>
