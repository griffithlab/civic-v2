query FeatureSelectTypeahead($queryTerm: String!, $featureType: FeatureInstanceTypes) {
  featureTypeahead(queryTerm: $queryTerm, featureType: $featureType) {
    ...FeatureSelectTypeaheadFields
  }
}

query FeatureSelectTag($featureId: Int!) {
  feature(id: $featureId) {
    ...FeatureSelectTypeaheadFields
  }
}

# Spreads LinkableFeature so a selected Feature lands in the cache in exactly
# the shape cvc-tag's watchFragment reads. Note the typeahead always returns
# __typename 'Feature'; the Gene/Factor/Fusion/Region union is nested one
# level down in featureInstance and is metadata, not the tag's identity.
fragment FeatureSelectTypeaheadFields on Feature {
  ...LinkableFeature
  featureAliases
  featureInstance {
    __typename
    ... on Gene {
      entrezId
    }
    ... on Factor {
      ncitId
    }
    ... on Fusion {
      fivePrimePartnerStatus
      threePrimePartnerStatus
    }
  }
}
