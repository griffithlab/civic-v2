<!-- show full tags for non-hidden entities -->
@for (entity of entities; track entity) {
  <span class="tag-container">
    <ng-container
      *ngTemplateOutlet="
        cvcTagTemplate;
        context: {
          $implicit: entity,
          config: config,
          emphasize: $safeNavigationMigration(config?.emphasize),
        }
      "></ng-container>
  </span>
}
