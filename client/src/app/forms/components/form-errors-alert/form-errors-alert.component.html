@if (errors.length === 1) {
  <nz-alert
    nzType="error"
    [nzDescription]="errors[0]"
    nzShowIcon></nz-alert>
}
@if (errors.length > 1) {
  <nz-alert
    nzType="error"
    [nzDescription]="errorList"
    nzShowIcon
    nzMessage="Submit Errors Occurred"></nz-alert>
}

<ng-template
  #errorList
  nzSize="small">
  <ul class="error-list">
    @for (error of errors; track error) {
      <li>{{ error }}</li>
    }
  </ul>
</ng-template>
