@if (events?.length) {
  <nz-timeline>
    @for (event of events; track event) {
      @if (event) {
        <nz-timeline-item [nzDot]="timelineDotTemplate">
          <ng-template #timelineDotTemplate>
            <i
              nz-icon
              [nzType]="event.action | iconNameForEventAction"
              nzTheme="twotone"
              class="item-icon"></i>
          </ng-template>
          <cvc-event-timeline-item
            [event]="event!"
            [tagDisplay]="tagDisplay"></cvc-event-timeline-item>
        </nz-timeline-item>
      }
    }
  </nz-timeline>
}
