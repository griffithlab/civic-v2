@for (s of nameSegments; track s; let i = $index) {
  @if (s.__typename == 'MolecularProfileTextSegment') {
    <span
      [innerHtml]="s.text"
      class="text-segment">
    </span>
  }
  @if (s.__typename == 'Variant') {
    <cvc-tag-group>
      <!-- ugly kludge to get feature-tag to accept nameSegments[i-1] as LinkableFeature -->
      @for (f of [nameSegments[i - 1]]; track f) {
        @if (f.__typename == 'Feature') {
          <cvc-feature-tag
            [feature]="f"
            [enablePopover]="enablePopover">
          </cvc-feature-tag>
        }
      }
      <cvc-variant-tag
        [variant]="s"
        [enablePopover]="enablePopover"></cvc-variant-tag>
    </cvc-tag-group>
  }
}
