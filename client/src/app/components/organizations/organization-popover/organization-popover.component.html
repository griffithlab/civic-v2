<div id="popover-content">
  @if (org$ | ngrxPush; as org) {
    <nz-card
      [nzTitle]="cardTitle"
      nzBordered="false"
      id="card-content">
      <!-- title -->
      <ng-template #cardTitle>
        <cvc-user-avatar
          [user]="{
            displayName: org.name,
            profileImagePath: org.profileImagePath,
          }"
          size="default"></cvc-user-avatar>
        <span
          nz-typography
          nzStyle="default"
          class="display-name"
          >{{ org.name }}</span
        >
      </ng-template>
      <!-- description -->
      <nz-row>
        <nz-col nzSpan="24">
          <div class="popover-text">
            <p nz-typography>
              @if (org.description; as desc) {
                <span>{{ desc }}</span>
              } @else {
                Organization has not provided a description.
              }
            </p>
          </div>
        </nz-col>
      </nz-row>
      <nz-descriptions
        nzSize="small"
        [nzColumn]="2"
        nzBordered="true">
        <!-- homepage -->
        <nz-descriptions-item nzTitle="Homepage">
          @if (org.url) {
            <cvc-link-tag [href]="org.url">
              {{ org.name }}
            </cvc-link-tag>
          } @else {
            --
          }
        </nz-descriptions-item>
      </nz-descriptions>
    </nz-card>
  }
</div>
