<button
  nz-button
  class="download-button"
  nzSize="small"
  (click)="downloadTable()"
  [disabled]="downloading | async">
  @if ((downloading | async) !== true) {
    <span
      nz-icon
      nzType="download"
      nzTheme="outline"></span>
  }
  @if (downloading | async) {
    <span
      nz-icon
      nzType="sync"
      [nzSpin]="true"></span>
  }
  Download
</button>
