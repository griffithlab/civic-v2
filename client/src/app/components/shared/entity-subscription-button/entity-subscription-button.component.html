@if (existingSubscription$ | ngrxPush; as subscription) {
  <button
    nz-button
    nz-tooltip="Unsubscribe"
    nzSize="small"
    (click)="unsubscribe()"
    [nzLoading]="isSubmitting">
    <i
      nz-icon
      nzType="bell"
      nzTheme="fill"></i>
  </button>
} @else {
  <button
    nz-button
    nz-tooltip="Subscribe"
    nzSize="small"
    (click)="subscribe()"
    [nzLoading]="isSubmitting">
    <i
      nz-icon
      nzType="bell"
      nzTheme="outline"></i>
  </button>
}
