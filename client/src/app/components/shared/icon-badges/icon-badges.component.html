<ng-content></ng-content>
@if (flagged) {
  <div
    class="cvc-badge badge-flags"
    [ngStyle]="{ background: flagColor }"></div>
}
@if (hasRevisions) {
  <div
    class="cvc-badge badge-revisions"
    [ngStyle]="{ background: entityColor }"></div>
}
@if (hasComments) {
  <div
    class="cvc-badge badge-comments"
    [ngStyle]="{ background: entityColor }"></div>
}
