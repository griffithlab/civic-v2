<nz-row id="section-tabs">
  <nz-col nzSpan="24">
    <nz-tabs
      nzLinkRouter
      nzType="card"
      nzSize="small"
      [nzTabBarExtraContent]="extraTpl">
      <ng-template #extraTpl>
        <ng-container [ngTemplateOutlet]="tabBarExtraContent || null">
        </ng-container>
      </ng-template>
      @for (tab of tabs; track tab) {
        <nz-tab>
          <a
            *nzTabLink
            nz-tab-link
            [routerLink]="tab.routeName"
            queryParamsHandling="merge">
            <i
              nz-icon
              [nzType]="tab.iconName"></i>
            {{ tab.tabLabel }}
            @if (tab.badgeCount && tab.badgeCount > 0) {
              <nz-badge
                nzStandalone
                [nzCount]="tab.badgeCount"
                nzTitle="{{ tab.badgeCount }} {{ tab.tabLabel }}(s)."
                [nzStyle]="{
                  transform: 'scale(0.75, 0.75) translate(0, -2px)',
                  backgroundColor: tab.badgeColor || '#ff4d4f',
                }">
              </nz-badge>
            }
          </a>
        </nz-tab>
      }
    </nz-tabs>
  </nz-col>
</nz-row>
