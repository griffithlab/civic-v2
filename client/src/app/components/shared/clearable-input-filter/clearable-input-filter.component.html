<nz-input-wrapper>
  <input
    type="text"
    nz-input
    nzSize="small"
    [placeholder]="placeholderText ? placeholderText : ''"
    [(ngModel)]="inputModel"
    (ngModelChange)="onModelUpdated()" />
  <span nzInputSuffix>
    @if (inputModel) {
      <i
        nz-icon
        class="ant-input-clear-icon"
        nzTheme="fill"
        nzType="close-circle"
        (click)="inputModel = undefined; onModelUpdated()"></i>
    }
  </span>
</nz-input-wrapper>
