# include server-generated schema and client-side schemas
# see: https://the-guild.dev/graphql/codegen/docs/guides/graphql-server-apollo-yoga-with-server-preset
schema:
  - ./src/app/generated/server.model.graphql
  - ./src/app/graphql/schemas/**/*.graphql

# collect client-side component & service queries, mutations, fragments
documents: ./src/**/*.gql
extensions:
  codegen:
    overwrite: true
    config:
      nonOptionalTypename: true
      futureProofUnions: false
      futureProofEnums: false
      maybeValue: T | undefined
      # custom scalars (ISO8601DateTime, JSON) remain `any`, matching the
      # pre-codegen-7 output; switching to `unknown`/explicit mappings is a
      # separate, deliberate change
      defaultScalarType: any
      serviceProvidedInRoot: true
    hooks:
      afterAllFileWrite:
        - node scripts/validate-generated-graphql.mjs
    generates:
      # schema-level types: Maybe, Scalars, enums, input & object types
      ./src/app/generated/civic.apollo.types.ts:
        plugins:
          - typescript
          - add:
              content: /* eslint-disable */
      # per-document operation types + apollo-angular services, emitted
      # next to each .gql source file as <name>.gql.generated.ts
      ./src/:
        preset: near-operation-file
        presetConfig:
          extension: .gql.generated.ts
          baseTypesPath: app/generated/civic.apollo.types.ts
          importTypesNamespace: Types
        plugins:
          - typescript-operations
          - typescript-apollo-angular
          - add:
              content: /* eslint-disable */
      ./src/app/generated/civic.possible-types.ts:
        plugins:
          - fragment-matcher
        config:
          apolloClientVersion: 3
          useExplicitTyping: false
          deterministic: true
      ./src/app/generated/civic.apollo-helpers.ts:
        plugins:
          - typescript-apollo-client-helpers
        config:
          useTypeImports: true
